# PilotDeck application profile. Mint Core only consumes this profile; the
# package names below are intentionally outside mint-core.
[profile]
name = "pilotdeck"

[packages]
required = [
  "pilotdeck/context-instructions@0.1.5",
  "pilotdeck/context-retention@0.2.3",
  "pilotdeck/context-tool-result-pruner@0.1.7",
  "pilotdeck/context-budget-production@0.3.4",
  "liyishan1/pilotdeck-attachments-consumer@0.1.0",
  "liyishan1/pilotdeck-compaction-port-owner@0.2.3",
  "liyishan1/pilotdeck-compaction-basic@0.1.3",
  "liyishan1/pilotdeck-context-prompt-consumer@0.1.2",
  "liyishan1/pilotdeck-context-time-consumer@0.1.0",
  "liyishan1/pilotdeck-tool-fs-state-types@0.1.1",
  "liyishan1/pilotdeck-tool-fs-read@0.1.3",
  "pilotdeck/model-provider-openai-consumer@0.1.4",
  "liyishan1/pilotdeck-context-image-offload@0.1.1",
]

[hooks]
order = [
  "liyishan1/pilotdeck-context-time-consumer",
  "liyishan1/pilotdeck-context-prompt-consumer",
  "pilotdeck/context-retention",
  "pilotdeck/context-tool-result-pruner",
]

[model]
provider = "pilotdeck/model-provider-openai-consumer"

# Opaque package configuration consumed by the installed hooks. Runtime Assembly
# forwards these values without embedding package-specific behavior in mint-core.
[package_config."liyishan1/pilotdeck-context-time-consumer"]
preparedContext = { systemPrompt = "You are a helpful assistant.", messages = [] }

[package_config."liyishan1/pilotdeck-context-prompt-consumer"]
provider = "mint"
permissionMode = "default"
environmentContext = ""

[package_config."pilotdeck/context-retention"]
retention = { maxResultSizeChars = 200000, previewBytes = 2048 }
