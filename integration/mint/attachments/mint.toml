# Mint 项目清单。`mint add` 维护 [dependencies]，`mint chat` / `mint gui` 启动界面。
# 模型在桌面设置或 `mint config edit` 中配置一次；项目不注入模型或密钥默认值。
[package]
name = "local/mint-pilotdeck-curated-install-20261105"
version = "0.1.0"
kind = "agent"
description = ""

[artifacts]
layout = "any"

[core]
version = "^0.1"
flavor = "std"
channel = "stable"
download = "auto"

[ui]
default = "mint/tui"
approval_timeout_s = 120

[registry]
default = "mint-hub"

[dependencies]
"pilotdeck/context-instructions" = "=0.1.6"
"pilotdeck/context-retention" = "=0.2.5"
"pilotdeck/context-tool-result-pruner" = "=0.1.8"
"pilotdeck/context-budget-production" = "=0.3.6"
"liyishan1/pilotdeck-attachments-consumer" = "=0.1.1"
"liyishan1/pilotdeck-compaction-port-owner" = "=0.2.3"
"liyishan1/pilotdeck-compaction-basic" = "=0.1.3"
"liyishan1/pilotdeck-context-prompt-consumer" = "=0.1.2"
"liyishan1/pilotdeck-context-time-consumer" = "=0.1.0"
"liyishan1/pilotdeck-tool-fs-state-types" = "=0.1.1"
"liyishan1/pilotdeck-tool-fs-read" = "=0.1.3"
"pilotdeck/model-provider-openai-consumer" = "=0.1.3"

[packages."pilotdeck/context-instructions".config.instructions]
projectRoot = "/"
cwd = "/"
pilotHome = "/.pilotdeck"

[packages."liyishan1/pilotdeck-context-prompt-consumer".config]
environmentContext = "Working directory: /Users/a1/Documents/ChatGPT/pilotdeck-mint-runtime"
[packages."liyishan1/pilotdeck-context-prompt-consumer".config.hostEnvironment]
platform = "darwin"
runtimeVersion = "Rust AgentCPM / Mint Host"
