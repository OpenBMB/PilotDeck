name: Web Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Web/Gateway dependencies only
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter pilotdeck-ui

      - name: Build Gateway and Web UI
        run: pnpm run build:web

      - name: Test context inspection and runtime activity boundaries
        run: >-
          node --test --test-timeout 60000
          dist/tests/session/model-context-snapshot.spec.js
          dist/tests/agent/loop/context-cap.spec.js
          dist/tests/agent/loop/memory-retrieval-dedup.spec.js
          dist/tests/context/memory-retrieval-dedup.spec.js
          dist/tests/context/token-accounting-runtime.spec.js
          dist/tests/gateway/gateway-server-port.spec.js
          dist/tests/gateway/background-runtime-reload.spec.js
          dist/tests/agent/runtime-lease.spec.js

      - name: Test Web UI and server
        # Vitest projects collect only src/ and server/ tests; browser E2E has
        # its own runner. Desktop Smoke runs updater tests with desktop dependencies.
        run: >-
          pnpm --dir ui exec vitest run
          --exclude 'server/services/desktopUpdateNetwork.test.ts'
          --exclude 'server/services/desktopUpdateAvailability.test.ts'
          --exclude 'server/services/desktopUpdates.spec.ts'
          --exclude 'server/services/desktopAutoUpdate.test.ts'
          --exclude 'server/services/jsonReleaseProvider.test.ts'

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pilotdeck:web-regression
      - name: Verify isolated image startup dependencies
        run: >-
          docker run --rm --entrypoint node pilotdeck:web-regression
          --import tsx --input-type=module -e
          "import { classifyRuntimeError } from '@pilotdeck/config';
          import './ui/server/runtimeBootstrap.js';
          if (classifyRuntimeError({code:'ENOENT'}) !== 'PD_RESOURCE_NOT_FOUND') process.exit(1);"
