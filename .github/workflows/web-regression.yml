name: Web Regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Select Web checks
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.paths.outputs.web }}
      browser: ${{ steps.paths.outputs.browser }}
      docker: ${{ steps.paths.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
      - name: Verify CI scope selection
        run: node --test apps/desktop/scripts/classify-ci-changes.test.mjs
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node apps/desktop/scripts/classify-ci-changes.mjs "$BASE_SHA" "$HEAD_SHA"

  web:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.web == 'true'
    # Keep the browser runner within the locked Playwright version's OS support.
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Web/Gateway dependencies only
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter pilotdeck-ui

      - name: Build Gateway and Web UI
        run: pnpm run build:web

      - name: Test CI and release workflow boundaries
        run: node --test apps/desktop/scripts/workflow-boundaries.test.mjs

      - name: Test context inspection and runtime activity boundaries
        run: >-
          node --test --test-timeout 60000
          dist/tests/session/model-context-snapshot.spec.js
          dist/tests/agent/loop/context-cap.spec.js
          dist/tests/agent/loop/memory-retrieval-dedup.spec.js
          dist/tests/context/memory-retrieval-dedup.spec.js
          dist/tests/context/token-accounting-runtime.spec.js
          dist/tests/gateway/gateway-server-port.spec.js
          dist/tests/gateway/background-runtime-reload.spec.js
          dist/tests/agent/runtime-lease.spec.js

      - name: Test Web UI and server
        # Vitest projects collect only src/ and server/ tests; browser E2E has
        # its own runner. Desktop Smoke runs updater tests with desktop dependencies.
        run: >-
          pnpm --dir ui exec vitest run
          --exclude 'server/services/desktopUpdateNetwork.test.ts'
          --exclude 'server/services/desktopUpdateAvailability.test.ts'
          --exclude 'server/services/desktopUpdates.spec.ts'
          --exclude 'server/services/desktopAutoUpdate.test.ts'
          --exclude 'server/services/jsonReleaseProvider.test.ts'

      - name: Install Chromium for chat scrolling regressions
        if: github.event_name != 'pull_request' || needs.changes.outputs.browser == 'true'
        run: pnpm --dir ui exec playwright install --with-deps chromium

      - name: Test chat scrolling, history, search and delayed media
        if: github.event_name != 'pull_request' || needs.changes.outputs.browser == 'true'
        run: pnpm --dir ui exec playwright test -c e2e/streaming-scroll.config.mjs

      - name: Upload chat scrolling failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chat-scrolling-failure
          path: artifacts/stream-playwright
          if-no-files-found: ignore

  docker:
    needs: changes
    if: github.event_name != 'pull_request' || needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pilotdeck:web-regression
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max
      - name: Verify isolated image startup dependencies
        run: >-
          docker run --rm --entrypoint node pilotdeck:web-regression
          --import tsx --input-type=module -e
          "import { classifyRuntimeError } from '@pilotdeck/config';
          import './ui/server/runtimeBootstrap.js';
          if (classifyRuntimeError({code:'ENOENT'}) !== 'PD_RESOURCE_NOT_FOUND') process.exit(1);"
