name: Desktop Build

on:
  workflow_call:
    inputs:
      release_date:
        description: Release date in YYYY-MM-DD (Asia/Shanghai)
        required: true
        type: string
      revision:
        description: Zero-based same-day build revision
        required: false
        default: "0"
        type: string
      require_macos_signing:
        description: Fail when macOS signing and notarization credentials are missing
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_APPLICATION_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
  workflow_dispatch:
    inputs:
      release_date:
        description: Optional YYYY-MM-DD release date; defaults to today in Asia/Shanghai
        required: false
        type: string
      revision:
        description: Zero-based same-day build revision
        required: false
        default: "0"
        type: string
      require_macos_signing:
        description: Require production macOS signing and notarization credentials
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  linux:
    name: Linux
    uses: ./.github/workflows/desktop-linux.yml
    with:
      release_date: ${{ inputs.release_date }}
      revision: ${{ inputs.revision || '0' }}

  macos:
    name: macOS
    uses: ./.github/workflows/desktop-macos.yml
    with:
      release_date: ${{ inputs.release_date }}
      revision: ${{ inputs.revision || '0' }}
      require_macos_signing: ${{ inputs.require_macos_signing }}
    secrets: inherit

  windows:
    name: Windows
    uses: ./.github/workflows/desktop-windows.yml
    with:
      release_date: ${{ inputs.release_date }}
      revision: ${{ inputs.revision || '0' }}
