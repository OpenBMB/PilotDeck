name: Daily Release

on:
  schedule:
    # 02:00 Asia/Shanghai (GitHub cron is UTC).
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even when production files have not changed
        required: false
        default: false
        type: boolean
      revision:
        description: Optional zero-based same-day revision; automatically increments when omitted
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: daily-release
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.detect.outputs.should_build }}
      release_date: ${{ steps.detect.outputs.release_date }}
      revision: ${{ steps.detect.outputs.revision }}
      source_sha: ${{ steps.detect.outputs.source_sha }}
    steps:
      - name: Require the main branch
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases must run from the main branch, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - name: Detect production changes since the last release
        id: detect
        shell: bash
        env:
          FORCE_RELEASE: ${{ inputs.force }}
          REQUESTED_REVISION: ${{ inputs.revision }}
        run: node apps/desktop/scripts/detect-release.mjs

  linux:
    name: Linux
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    uses: ./.github/workflows/desktop-linux.yml
    with:
      release_date: ${{ needs.detect.outputs.release_date }}
      revision: ${{ needs.detect.outputs.revision }}

  macos:
    name: macOS
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    uses: ./.github/workflows/desktop-macos.yml
    with:
      release_date: ${{ needs.detect.outputs.release_date }}
      revision: ${{ needs.detect.outputs.revision }}
      require_macos_signing: true
    secrets: inherit

  windows:
    name: Windows
    needs: detect
    if: ${{ needs.detect.outputs.should_build == 'true' }}
    uses: ./.github/workflows/desktop-windows.yml
    with:
      release_date: ${{ needs.detect.outputs.release_date }}
      revision: ${{ needs.detect.outputs.revision }}

  release:
    permissions:
      contents: write
    needs: [detect, linux, macos, windows]
    if: ${{ needs.detect.outputs.should_build == 'true' && needs.linux.result == 'success' && needs.macos.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1

      - uses: actions/download-artifact@v8
        with:
          pattern: pilotdeck-desktop-*
          path: release-assets
          merge-multiple: true

      - name: Resolve release metadata
        id: metadata
        env:
          PILOTDECK_RELEASE_DATE: ${{ needs.detect.outputs.release_date }}
          PILOTDECK_RELEASE_REVISION: ${{ needs.detect.outputs.revision }}
          PILOTDECK_COMMIT_SHA: ${{ needs.detect.outputs.source_sha }}
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Create release manifest and checksums
        env:
          PILOTDECK_RELEASE_VERSION: ${{ steps.metadata.outputs.version }}
          PILOTDECK_RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          PILOTDECK_RELEASE_DATE: ${{ steps.metadata.outputs.release_date }}
          PILOTDECK_COMMIT_SHA: ${{ needs.detect.outputs.source_sha }}
        run: node apps/desktop/scripts/create-release-manifest.mjs release-assets

      - name: Verify complete cross-platform release and updater feeds
        run: node apps/desktop/scripts/verify-release-assets.mjs release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.metadata.outputs.release_tag }}
          SOURCE_SHA: ${{ needs.detect.outputs.source_sha }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "$RELEASE_TAG" \
            --latest \
            --generate-notes

  skipped:
    needs: detect
    if: ${{ needs.detect.outputs.should_build != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "No production changes since the latest release."
