name: macOS

on:
  workflow_call:
    inputs:
      release_date:
        description: Optional release date in YYYY-MM-DD
        required: false
        default: ""
        type: string
      revision:
        description: Zero-based same-day build revision
        required: false
        default: "0"
        type: string

      require_macos_signing:
        description: Require production signing and notarization
        required: false
        default: false
        type: boolean
    secrets:
      MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64:
        required: false
      MACOS_DEVELOPER_ID_APPLICATION_PASSWORD:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      APPLE_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  macos:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-latest
            host_arch: arm64
            binary_arch: arm64
          - arch: x64
            runner: macos-15-intel
            host_arch: x86_64
            binary_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      PILOTDECK_RELEASE_DATE: ${{ inputs.release_date }}
      PILOTDECK_RELEASE_REVISION: ${{ inputs.revision }}
      PILOTDECK_COMMIT_SHA: ${{ github.sha }}
      PILOTDECK_DESKTOP_NODE_ARCH: ${{ matrix.arch }}
      PILOTDECK_DESKTOP_REQUIRE_SIGNING: ${{ inputs.require_macos_signing && '1' || '0' }}
      CSC_FOR_PULL_REQUEST: "true"
      CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.require_macos_signing && 'true' || 'false' }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify macOS build host
        env:
          EXPECTED_HOST_ARCH: ${{ matrix.host_arch }}
        run: test "$(uname -m)" = "$EXPECTED_HOST_ARCH"

      - name: Verify managed process ownership and crash cleanup
        run: node --test apps/desktop/scripts/process-scope.test.mjs

      - name: Verify computer use lifecycle and pinned assets
        run: node --test apps/desktop/scripts/computer-use.test.mjs

      - name: Verify macOS background and quit lifecycle
        run: node apps/desktop/scripts/verify-desktop-lifecycle.cjs

      - name: Set desktop release metadata
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Import Developer ID certificate
        if: ${{ inputs.require_macos_signing }}
        shell: bash
        env:
          CERTIFICATE_PATH: ${{ runner.temp }}/developer-id-application.p12
          KEYCHAIN_PATH: ${{ runner.temp }}/pilotdeck-signing.keychain-db
          CERTIFICATE_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          KEYCHAIN_PASSWORD_SECRET: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_BASE64" ] || [ -z "$CERTIFICATE_PASSWORD" ]; then
            echo "::error::macOS release signing certificate secrets are required."
            exit 1
          fi
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "::error::Apple notarization secrets are required."
            exit 1
          fi
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(base64.b64decode(os.environ["CERTIFICATE_BASE64"]))
          PY
          keychain_password="${KEYCHAIN_PASSWORD_SECRET:-pilotdeck-ci-keychain}"
          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=true" >> "$GITHUB_ENV"

      - name: Build macOS ${{ matrix.arch }} installer
        shell: bash
        run: |
          if [ "$PILOTDECK_DESKTOP_REQUIRE_SIGNING" = 1 ]; then
            pnpm --filter pilotdeck-desktop run dist:mac:${{ matrix.arch }}
          else
            pnpm --filter pilotdeck-desktop run dist:mac:${{ matrix.arch }} --dir --config.mac.identity=-
          fi

      - name: Verify macOS artifact
        shell: bash
        env:
          MACOS_ARCH: ${{ matrix.arch }}
          MACH_ARCH: ${{ matrix.binary_arch }}
        run: |
          app_path="$(find apps/desktop/dist-electron -mindepth 2 -maxdepth 2 -type d -name 'PilotDeck.app' -print -quit)"
          dmg_path="$(find apps/desktop/dist-electron -maxdepth 1 -name "*-mac-${MACOS_ARCH}.dmg" -print -quit)"
          test -n "$app_path"
          if [ "$PILOTDECK_DESKTOP_REQUIRE_SIGNING" = 1 ]; then test -n "$dmg_path"; fi
          test "$(lipo -archs "$app_path/Contents/MacOS/PilotDeck")" = "$MACH_ARCH"
          test "$(lipo -archs "$app_path/Contents/Resources/node/bin/node")" = "$MACH_ARCH"
          "$app_path/Contents/Resources/node/bin/node" apps/desktop/scripts/verify-cua-driver.cjs "$app_path/Contents/Resources" "$MACOS_ARCH"
          codesign --verify --strict "$app_path/Contents/Resources/runtime/resources/cua-driver/PilotDeck Computer Use.app"
          native_path="$(find "$app_path/Contents/Resources/runtime/node_modules/better-sqlite3" -name '*.node' -print -quit)"
          test -n "$native_path"
          test "$(lipo -archs "$native_path")" = "$MACH_ARCH"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          if [ "$PILOTDECK_DESKTOP_REQUIRE_SIGNING" = 1 ]; then hdiutil verify "$dmg_path"; fi
          updater_args=()
          if [ "$PILOTDECK_DESKTOP_REQUIRE_SIGNING" != 1 ]; then updater_args+=(--directory-only); fi
          ELECTRON_RUN_AS_NODE=1 "$app_path/Contents/MacOS/PilotDeck" apps/desktop/scripts/verify-updater.cjs "$app_path/Contents/Resources/app.asar" "${updater_args[@]}"

      - name: Verify production macOS identity and notarization
        if: ${{ inputs.require_macos_signing }}
        shell: bash
        run: |
          app_path="$(find apps/desktop/dist-electron -mindepth 2 -maxdepth 2 -type d -name 'PilotDeck.app' -print -quit)"
          test -n "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Authority=Developer ID Application:'
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Prepare architecture-specific macOS update feed
        if: ${{ inputs.require_macos_signing }}
        run: |
          test -s apps/desktop/dist-electron/latest-mac.yml
          test -s apps/desktop/dist-electron/PilotDeck-*-mac-${{ matrix.arch }}.zip
          mv apps/desktop/dist-electron/latest-mac.yml apps/desktop/dist-electron/latest-${{ matrix.arch }}-mac.yml

      - name: Upload macOS installer
        if: ${{ inputs.require_macos_signing }}
        uses: actions/upload-artifact@v7
        with:
          name: pilotdeck-desktop-macos-${{ matrix.arch }}
          overwrite: true
          path: |
            apps/desktop/dist-electron/*-mac-${{ matrix.arch }}.dmg
            apps/desktop/dist-electron/*-mac-${{ matrix.arch }}.zip
            apps/desktop/dist-electron/latest-${{ matrix.arch }}-mac.yml
          if-no-files-found: error
          retention-days: 14
