name: Windows

on:
  workflow_call:
    inputs:
      release_date:
        description: Optional release date in YYYY-MM-DD
        required: false
        default: ""
        type: string
      revision:
        description: Zero-based same-day build revision
        required: false
        default: "0"
        type: string
      require_windows_signing:
        description: Sign with Certum cloud credentials from the windows-signing environment
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_date:
        description: Optional YYYY-MM-DD release date
        required: false
        type: string
      revision:
        description: Zero-based same-day build revision
        default: "0"
        type: string
      require_windows_signing:
        description: Require Certum cloud signing (main branch only)
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ inputs.require_windows_signing && 'windows-certum-signing' || format('windows-build-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PILOTDECK_UPDATE_REPOSITORY: ${{ github.repository }}

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      # A Certum TOTP can only be consumed once; serialize the two cloud logins.
      max-parallel: ${{ inputs.require_windows_signing && 1 || 2 }}
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            unpacked_dir: win-unpacked
          - arch: arm64
            runner: windows-11-arm
            unpacked_dir: win-arm64-unpacked
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.require_windows_signing && 'windows-signing' || '' }}
    timeout-minutes: 60
    env:
      PILOTDECK_DESKTOP_NODE_ARCH: ${{ matrix.arch }}
      PILOTDECK_RELEASE_DATE: ${{ inputs.release_date }}
      PILOTDECK_RELEASE_REVISION: ${{ inputs.revision }}
      PILOTDECK_COMMIT_SHA: ${{ github.sha }}
      PILOTDECK_WINDOWS_SIGNING: off
    steps:
      - name: Restrict signing to trusted main-branch releases
        if: ${{ inputs.require_windows_signing }}
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_EVENT: ${{ github.event_name }}
        run: |
          if ($env:SOURCE_REPOSITORY -ne 'OpenBMB/PilotDeck' -or $env:SOURCE_REF -ne 'refs/heads/main' -or $env:SOURCE_EVENT -notin @('schedule', 'workflow_dispatch', 'push')) {
            throw 'Production code signing is only allowed for trusted main-branch runs.'
          }

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Verify native Windows build host
        run: node apps/desktop/scripts/check-windows-build-host.mjs ${{ matrix.arch }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify managed process ownership and crash cleanup
        run: node --test apps/desktop/scripts/process-identity.test.mjs apps/desktop/scripts/process-scope.test.mjs

      - name: Verify computer use lifecycle and pinned assets
        run: node --test apps/desktop/scripts/computer-use.test.mjs

      - name: Verify Windows tray and quit confirmation
        run: node --test apps/desktop/scripts/desktop-lifecycle.test.mjs

      - name: Verify Windows signing policy
        run: node --test apps/desktop/scripts/windows-signing.test.mjs

      - name: Verify tray lifecycle in Electron with an isolated runtime
        run: node apps/desktop/scripts/verify-windows-tray.cjs

      - name: Compile and verify NSIS launch paths
        run: node apps/desktop/scripts/verify-installer.cjs

      - name: Verify installer extraction, commit and progress
        run: node apps/desktop/scripts/verify-installer-payload.cjs

      - name: Install, upgrade and uninstall an isolated NSIS fixture
        run: node apps/desktop/scripts/verify-installer-e2e.cjs

      - name: Set desktop release metadata
        run: node apps/desktop/scripts/set-ci-version.mjs

      - name: Disable Windows signing
        shell: pwsh
        run: |
          "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PILOTDECK_WINDOWS_SIGNING=off" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare pinned Certum cloud signing tool
        if: ${{ inputs.require_windows_signing }}
        shell: pwsh
        run: ./apps/desktop/scripts/setup-cloud-signing.ps1

      - name: Build Windows runtime and desktop sources
        shell: pwsh
        run: |
          pnpm --filter pilotdeck-desktop run build:runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime build failed.' }
          pnpm --filter pilotdeck-desktop run compile
          if ($LASTEXITCODE -ne 0) { throw 'Desktop compile failed.' }

      - name: Build signed Windows ${{ matrix.arch }} installer
        if: ${{ inputs.require_windows_signing }}
        env:
          PILOTDECK_WINDOWS_SIGNING: required
          PILOTDECK_WINDOWS_SIGNING_PROVIDER: ssign
          PILOTDECK_WINDOWS_CERT_SHA1: ${{ vars.WINDOWS_CERT_SHA1 }}
          PILOTDECK_WINDOWS_PUBLISHER: ${{ vars.WINDOWS_PUBLISHER }}
          CERTUM_EMAIL: ${{ secrets.CERTUM_EMAIL }}
          CERTUM_OTP: ${{ secrets.CERTUM_OTP }}
          XDG_RUNTIME_DIR: ${{ runner.temp }}/pilotdeck-signing-session
        shell: pwsh
        run: |
          if (-not $env:CERTUM_EMAIL -or -not $env:CERTUM_OTP) { throw 'Set CERTUM_EMAIL and CERTUM_OTP in the windows-signing environment.' }
          if (-not $env:PILOTDECK_WINDOWS_CERT_SHA1 -or -not $env:PILOTDECK_WINDOWS_PUBLISHER) { throw 'Set WINDOWS_CERT_SHA1 and WINDOWS_PUBLISHER in the windows-signing environment.' }
          pnpm --dir apps/desktop exec electron-builder --config electron-builder.config.cjs --win --${{ matrix.arch }} --publish never
          if ($LASTEXITCODE -ne 0) { throw 'Signed Windows build failed.' }
          $installer = Get-ChildItem 'apps/desktop/dist-electron/*-win-${{ matrix.arch }}-setup.exe' | Select-Object -First 1
          node apps/desktop/scripts/windows-signing.cjs verify $installer.FullName 'apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/PilotDeck.exe' 'apps/desktop/resources/.installer-tools/install-payload.exe'
          if ($LASTEXITCODE -ne 0) { throw 'Windows signature verification failed.' }

      - name: Remove temporary cloud signing session
        if: ${{ always() && inputs.require_windows_signing }}
        shell: pwsh
        run: |
          $sessionRoot = [IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP 'pilotdeck-signing-session'))
          $expectedParent = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/')
          if ([IO.Path]::GetDirectoryName($sessionRoot) -ne $expectedParent) { throw 'Unexpected signing cache location.' }
          if (Test-Path -LiteralPath $sessionRoot) { Remove-Item -LiteralPath $sessionRoot -Recurse -Force }

      - name: Build Windows ${{ matrix.arch }} installer
        if: ${{ !inputs.require_windows_signing }}
        run: pnpm --dir apps/desktop exec electron-builder --config electron-builder.config.cjs --win --${{ matrix.arch }} --publish never

      - name: Verify Windows artifact
        timeout-minutes: 5
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop/dist-electron/*-win-${{ matrix.arch }}-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          if ($installer.Length -le 0) { throw 'Windows installer is empty.' }
          & 'apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/resources/node/node.exe' apps/desktop/scripts/verify-windows-package.cjs 'apps/desktop/dist-electron/${{ matrix.unpacked_dir }}' '${{ matrix.arch }}' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Packaged runtime validation failed.' }
          $env:ELECTRON_RUN_AS_NODE = '1'
          & 'apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/PilotDeck.exe' apps/desktop/scripts/verify-updater.cjs apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/resources/app.asar | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Packaged updater validation failed.' }
          Remove-Item Env:ELECTRON_RUN_AS_NODE

      - name: Prepare Windows update feed
        shell: pwsh
        run: |
          $feed = 'apps/desktop/dist-electron/latest-${{ matrix.arch }}.yml'
          # Windows builds emit latest.yml; retain separate feeds per architecture.
          Move-Item 'apps/desktop/dist-electron/latest.yml' $feed
          if (-not (Test-Path $feed)) { throw 'Update feed was not generated.' }
          $installer = Get-ChildItem 'apps/desktop/dist-electron/*-win-${{ matrix.arch }}-setup.exe' | Select-Object -First 1
          if (-not (Select-String -Path $feed -SimpleMatch $installer.Name -Quiet)) { throw 'Update feed references the wrong installer.' }
          if (-not (Test-Path 'apps/desktop/dist-electron/${{ matrix.unpacked_dir }}/resources/elevate.exe')) { throw 'Update elevation helper is missing.' }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          name: pilotdeck-desktop-windows-${{ matrix.arch }}
          overwrite: true
          path: |
            apps/desktop/dist-electron/*-win-${{ matrix.arch }}-setup.exe
            apps/desktop/dist-electron/latest-${{ matrix.arch }}.yml
          if-no-files-found: error
          retention-days: 14
