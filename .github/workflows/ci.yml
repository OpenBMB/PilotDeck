name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CI: true
  PILOT_HOME: ${{ runner.temp }}/pilotdeck-home

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm --dir ui run lint
      - run: pnpm --dir ui run typecheck

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm --dir ui run test

  build:
    name: Build
    needs: static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm --dir ui run build
      - uses: actions/upload-artifact@v6
        with:
          name: pilotdeck-build-${{ github.sha }}
          path: |
            dist
            ui/dist
          if-no-files-found: error
          retention-days: 1

  contract:
    name: Contract
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:contract

  artifact:
    name: Artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v7
        with:
          name: pilotdeck-build-${{ github.sha }}
      - run: node scripts/test-artifact.mjs

  coverage:
    name: Coverage
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with: { version: 10.32.1 }
      - uses: actions/setup-node@v6
        with: { node-version: 22.23.1, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:coverage

  all-checks-pass:
    name: All checks pass
    if: ${{ always() }}
    needs: [static, unit, contract, build, artifact, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every gate to pass
        run: |
          test "${{ needs.static.result }}" = success
          test "${{ needs.unit.result }}" = success
          test "${{ needs.contract.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.artifact.result }}" = success
          test "${{ needs.coverage.result }}" = success
