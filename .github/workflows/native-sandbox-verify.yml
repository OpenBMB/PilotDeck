name: Native Sandbox & P0 Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/native-sandbox-verify.yml"
      - "packages/native-sandbox/**"
      - "src/tool/builtin/bash/**"
      - "src/session/checkpoints/**"
      - "src/context/budget/**"
      - "src/cli/createLocalGateway.ts"
      - "tests/tool/sandboxed-command-runner.spec.ts"
      - "tests/context/tokenizer.spec.ts"
      - "tests/session/workspace-checkpoints.spec.ts"
  push:
    branches: [main]
    paths:
      - ".github/workflows/native-sandbox-verify.yml"
      - "packages/native-sandbox/**"
      - "src/tool/builtin/bash/**"
      - "src/session/checkpoints/**"
      - "src/context/budget/**"
      - "src/cli/createLocalGateway.ts"

permissions:
  contents: read

concurrency:
  group: native-sandbox-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter @pilotdeck/native-sandbox

      - name: Build @pilotdeck/native-sandbox
        run: pnpm --filter @pilotdeck/native-sandbox run build

      - name: Verify native sandbox backend binding
        shell: bash
        run: |
          backend=$(node -e "console.log(require('./packages/native-sandbox').sandboxBackend())")
          echo "Detected sandbox backend: $backend"
          if [[ "${{ runner.os }}" == "Windows" && "$backend" != "windows-job" ]]; then
            echo "Expected windows-job backend on Windows, got: $backend"
            exit 1
          fi

      - name: TypeScript typecheck
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Run P0 and Sandbox verification tests
        run: >-
          node --import tsx --test
          tests/tool/sandboxed-command-runner.spec.ts
          tests/context/tokenizer.spec.ts
          tests/context/token-budget-manager.spec.ts
          tests/context/token-accounting-runtime.spec.ts
          tests/session/workspace-checkpoints.spec.ts
          tests/runtime/python-runtime.spec.ts
          tests/cli/createLocalGateway.test.ts
          tests/gateway/python-reload.spec.ts

