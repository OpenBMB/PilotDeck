name: Desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - src/**
      - tests/**
      - scripts/**
      - ui/**
      - skills/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/desktop-*.yml
      - .github/workflows/release.yml
      - .github/workflows/release-retry.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  checkpoint-regression:
    name: Checkpoints (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Web and Gateway dependencies
        run: pnpm install --frozen-lockfile --filter pilotdeck --filter pilotdeck-ui
      - name: Build Gateway and regression tests
        run: pnpm run build
      - name: Test MCP transport, observations and managed computer use
        run: pnpm run test:mcp
      - name: Test checkpoints, restore, Git operations and internal ignore rules
        run: pnpm run test:checkpoints
      - name: Test review UI and Windows path matching
        run: >-
          pnpm --dir ui exec vitest run
          src/components/chat-review/ChatReview.spec.tsx
          src/components/chat-review/ChangesReviewTab.spec.tsx
          src/components/chat-review/GitReviewTab.spec.tsx
          src/components/chat-review/TurnFileResults.spec.tsx
          src/utils/workspaceFileMention.spec.ts
          server/routes/checkpoints.test.js
          server/utils/pilotPaths.test.js
          server/utils/pathSafety.test.js

  static-checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.1
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile desktop shell
        run: pnpm --filter pilotdeck-desktop run compile

      - name: Test desktop packaging helpers
        run: pnpm --filter pilotdeck-desktop run test

      - name: Test desktop updater network
        # Requires electron-updater, intentionally absent from the Web-only job.
        run: pnpm --dir ui exec vitest run server/services/desktopUpdateNetwork.test.ts server/services/desktopUpdates.spec.ts server/services/desktopAutoUpdate.test.ts

  # PRs exercise the same native packages and updater feeds as releases.
  linux:
    name: Linux
    uses: ./.github/workflows/desktop-linux.yml

  macos:
    name: macOS
    uses: ./.github/workflows/desktop-macos.yml

  windows:
    name: Windows
    uses: ./.github/workflows/desktop-windows.yml
