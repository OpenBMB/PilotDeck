schemaVersion: 1
agent:
  model: external/default
model:
  providers:
    external:
      protocol: openai
      url: https://model.example.invalid/v1
      apiKey: ${PILOTDECK_API_KEY}
      models:
        default: {}
modules:
  agentLoop:
    enabled: true
    implementationId: example.loop
    contract: pilotdeck.agent-loop/v1
    transport: module-tcp-v2
    host: loop.example.invalid
    port: 9020
    methods: [execute, cancel, status, resume, ack]
    deployment:
      mode: image
      image: example.invalid/pilotdeck-loop:1
      port: 9020
  skills:
    enabled: true
    implementationId: example.skills
    contract: pilotdeck.skills/v1
    transport: module-http-v2
    endpoint: http://skills.example.invalid:9021
    methods: [list, read]
    deployment:
      mode: image
      image: example.invalid/skills:1
      port: 9021
  tools:
    enabled: true
    implementationId: example.tools
    contract: pilotdeck.tools/v1
    transport: module-http-v2
    endpoint: http://tools.example.invalid:9022
    methods: [execute]
    catalog:
      - name: remote_lookup
        description: Look up an externally owned value.
        inputSchema: { type: object }
        readOnly: true
        concurrencySafe: true
    deployment:
      mode: image
      image: example.invalid/tools:1
      port: 9022
  context:
    enabled: true
    implementationId: example.context
    contract: pilotdeck.context/v1
    transport: module-http-v2
    endpoint: http://context.example.invalid:9023
    methods: [prepare_for_model, apply_tool_results, recover_from_model_error, capture_turn, try_auto_compact]
    deployment:
      mode: image
      image: example.invalid/context:1
      port: 9023
  modelProvider:
    enabled: true
    implementationId: example.model
    contract: pilotdeck.model/v1
    transport: module-http-v2
    endpoint: http://model.example.invalid:9024
    methods: [prepare, stream]
    deployment:
      mode: image
      image: example.invalid/model:1
      port: 9024
  knowledge:
    enabled: true
    implementationId: example.knowledge
    contract: staffdeck.knowledge/v1
    transport: module-http-v2
    endpoint: http://knowledge.example.invalid:9026
    methods: [list_bases, create_base, get_base, update_base, delete_base, list_versions, sync_base, publish_version, rollback_version, list_documents, get_document, import_document, import_okf, update_document, delete_document, list_document_buckets, update_bucket, list_bucket_chunks, update_chunk, get_job, list_jobs, cancel_job, list_okf_concepts, get_okf_concept, upsert_okf_concept, export_okf, lint_okf, list_discoveries, confirm_discovery, reject_discovery, query, resolve_citation]
    deployment:
      mode: image
      image: example.invalid/knowledge:1
      port: 9026
  sop:
    enabled: true
    implementationId: example.sop
    contract: sop.lifecycle/v2
    transport: sop-http-v2
    endpoint: http://sop.example.invalid:9025
    manifestPath: /healthz
    definitionsPath: ../conformance/fixture.yaml
    defaultSopId: approval
    deployment:
      mode: image
      image: example.invalid/sop:1
      port: 9025
      healthPath: /healthz
