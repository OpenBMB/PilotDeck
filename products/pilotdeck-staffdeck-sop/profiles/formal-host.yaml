schemaVersion: 1
agent:
  model: smoke/operator
model:
  providers:
    smoke:
      protocol: openai
      url: http://127.0.0.1:18092/v1
      apiKey: local-only
      models:
        operator:
          capabilities:
            supportsToolUse: true
modules:
